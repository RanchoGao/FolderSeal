name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    name: Build & Validate (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and run full validation suite (including NTFS ACL tests)
        shell: pwsh
        run: |
          .\scripts\build.ps1 -ValidateAll -ValidateAcl

      - name: Upload test failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-work-failure-logs
          path: artifacts/test-work
          if-no-files-found: ignore
          retention-days: 7
